# Base44 development stack.
#
# Every application service runs the cloned source with a live-reload dev command:
# frontend (Vite), backend (Spring Boot via Maven), ai-service (uvicorn). Nothing is built
# from a prebuilt application image, so source edits are picked up without rebuilding.
#
# No external service credentials are required: PostgreSQL, the API and the AI service all
# run here as plain compose services. The local development credentials below are dev-only
# values generated for this sandbox, not user secrets.
#
# Wiring: PostgreSQL is internal (not published). The frontend is published on host port
# 3000 and proxies /api to the backend, so the browser only ever talks to one origin and no
# CORS configuration is needed in the preview. The ai-service is deliberately NOT published:
# POST /api/code/execute-tests runs submitted Python code, so it stays inside the compose
# network and is reached from the host with `docker compose exec ai-service ...`.

services:
  postgres:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_DB: smart_jobs
      POSTGRES_USER: smart_jobs
      POSTGRES_PASSWORD: smart_jobs-dev-only-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_jobs -d smart_jobs"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: maven:3.9-eclipse-temurin-21
    restart: on-failure
    working_dir: /app
    # application.yml hardcodes jdbc:postgresql://localhost, which cannot reach the postgres
    # service; these Spring relaxed-binding overrides point it at the compose service.
    #
    # The controllers allow http://localhost:5173 for local development. Browsers attach an
    # Origin header to POST/PUT/PATCH/DELETE even when the request looks same-origin, and
    # Spring rejects any origin outside that list, so the preview origins are added here
    # (both properties default to inert values when unset outside the sandbox).
    environment:
      - BACKEND_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smart_jobs
      - SPRING_DATASOURCE_USERNAME=smart_jobs
      - SPRING_DATASOURCE_PASSWORD=smart_jobs-dev-only-password
      - APP_CORS_ALLOWED_ORIGINS=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - APP_CORS_SANDBOX_ORIGIN=http://localhost:3000
    volumes:
      - ./backend:/app
      - backend-maven-repo:/root/.m2
    command: ["sh", "-ec", "mvn -q -DskipTests spring-boot:run"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  ai-service:
    image: python:3.12-slim
    restart: on-failure
    working_dir: /app
    volumes:
      - ./ai-service:/app
      - ai-service-pip-cache:/root/.cache/pip
    command: ["sh", "-ec", "pip install -q -r requirements.txt && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'python -c "import urllib.request; print(urllib.request.urlopen(''http://127.0.0.1:8000/health'', timeout=3).status)" | grep -q 200'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    image: node:22
    restart: on-failure
    working_dir: /app
    # VITE_API_BASE_URL is intentionally empty: the app then calls /api on its own origin and
    # the proxy declared in vite.config.ts (gated on BASE44_PREVIEW_MODE=1) forwards it to the
    # backend service. __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS lets Vite accept the proxied
    # preview hostname (Vite >= 6.1 appends it to server.allowedHosts).
    environment:
      - VITE_API_BASE_URL=
      - VITE_API_PROXY_TARGET=http://backend:8080
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"]
    ports:
      - "3000:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'node -e "fetch(''http://127.0.0.1:5173/'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

volumes:
  postgres-data:
  backend-maven-repo:
  frontend-node-modules:
  ai-service-pip-cache:
