server:
  port: ${BACKEND_PORT:8080}
  error:
    include-message: never

spring:
  application:
    name: smart-job-backend
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:smart_jobs}
    username: ${POSTGRES_USER:smart_jobs}
    password: ${POSTGRES_PASSWORD:change-me-locally}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
